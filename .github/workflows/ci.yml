name: CI
#
# ⚠️ 잡 이름 `ci` 를 바꾸지 마라. 검사 이름이 `{호출잡}/{피호출잡}` 이 되므로
# (실측: coolbress/standards CPR-007), 이 이름이 룰셋의 required context
# `ci / lint`·`ci / typecheck`·`ci / test`·`ci / build` 와 묶여 있다.
# 바꾸면 요구된 이름이 영원히 보고되지 않아 저장소가 머지 불가로 잠긴다.
#
# 🔴 이건 **템플릿 자신의** CI 다. 인스턴스로 나가는 것은 `template/.github/workflows/ci.yml` 이다.
# 둘이 따로 있는 이유가 `_subdirectory: template` 을 쓴 이유다 — GitHub 은 **루트의**
# `.github/workflows/` 만 돌리므로, 이 파일은 이 저장소를 검사하고 저 파일은 인스턴스로 간다.
#
# CI 로직은 여기 없다 — coolbress/workflows 한 곳에 있고 @SHA 로 핀한다.
# 핀은 반드시 커밋 SHA 다 (태그는 가변 = 공급망 벡터). 옆의 주석이 그 SHA 의 버전이다 —
# 무엇이 바뀌는지는 릴리스 노트로 읽는다: github.com/coolbress/workflows/releases
# 갱신하려면 아래 SHA 를 올린다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR 에 새로 푸시하면 이전 실행을 취소한다 — 낡은 커밋에 러너를 태우지 않는다.
# main 은 취소하지 않는다: 머지된 커밋의 결과는 전부 남아야 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: coolbress/workflows/.github/workflows/python-ci.yml@f31175a58afbbddfef7a34d7d0f638b4f7591d65 # v3.5.0
    with:
      # 🔴 여기만 기본값을 늘린다. 기본 제외는 `*.md`·`*.lock` 인데 이 저장소에는
      # `README.md.jinja`·`uv.lock.jinja` 가 있다 — **`.jinja` 는 렌더 지시이지 새 종류의 파일이 아니다.**
      #
      # 🔬 이걸 안 넣으면 무슨 일이 나나 (2026-08-28 실측): `uv.lock` → `uv.lock.jinja` 로
      # 이름을 바꿨더니 diff 가 258줄에서 **676줄**로 뛰었다. git 은 pathspec 이 옛 경로를
      # 가리면 그 짝을 **이름 변경으로 못 보고 순수 추가로 센다.** 락파일 1줄 고친 것이
      # 418줄로 계산된 것이다 — **규칙이 틀린 게 아니라 계량기가 틀렸다.**
      diff-size-exclude: "*.md *.md.jinja *.lock *.lock.jinja *lock.json *lock.yaml *lock.yml LICENSE"


# 🔴 이건 **템플릿 자신의** 프로젝트다. 인스턴스로 나가는 것은 `template/pyproject.toml` 이다.
#
# 왜 루트에도 파이썬 프로젝트가 있나: 이 저장소의 룰셋이 `ci / lint`·`typecheck`·`test`·`build`
# 를 요구 검사로 걸고 있고, 그 이름은 `{호출잡}/{피호출잡}` 이라 **잡 이름을 바꾸면 저장소가
# 조용히 머지 불가로 잠긴다**(`workflows` README §잡 이름 `ci` 를 바꾸지 마라).
# 그래서 루트는 계속 재사용 워크플로가 검사할 수 있는 파이썬 프로젝트로 남는다.
#
# 그리고 그게 낭비가 아니다 — 루트 패키지의 일은 **템플릿을 실제로 렌더해 보는 것**이다.
# 설정이 맞는지 눈으로 읽는 것과 렌더가 되는지 보는 것은 다른 문장이다.
[project]
name = "template-render"
version = "1.0.0"
description = "이 템플릿을 렌더해서 결과를 검사하는 하네스"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["template/LICENSE"]
authors = [{ name = "coolbress" }]
dependencies = ["copier>=9.0"]

[project.urls]
Homepage = "https://github.com/coolbress/project-template"
Issues = "https://github.com/coolbress/project-template/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# 🔴 `template/` 은 렌더 전이라 파이썬으로 성립하지 않는다 —
# 파일 이름에 `{{ }}` 가 들어 있고 `.jinja` 는 파이썬이 아니다. 린터를 들이지 않는다.
exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
exclude = ["^template/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

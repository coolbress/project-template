# copier 템플릿 설정.
#
# 왜 copier 인가: `gh repo create --template` 은 **시점 복사**라 복사가 끝나면 원본과
# 연결이 끊긴다. 템플릿을 고쳐도 인스턴스는 그대로다 — 2026-08-28 하루에만
# *"기존 인스턴스는 자동으로 안 바뀐다"* 를 세 번 적었다(AGENTS.md · CONTRIBUTING 시험 · 이슈 폼).
# copier 는 인스턴스에 `.copier-answers.yml` 을 남겨 **어느 판에서 태어났는지** 기억하고,
# `copier update` 로 그 뒤의 템플릿 변경을 **병합**한다.
#
# 🔵 **2단계 완료 — 이름 치환이 jinja 로 들어왔고 `bootstrap.sh` 는 없다.**
# 이게 copier 가 권하는 배치다: *"different dotfiles for your template and for the projects
# it generates."* 루트는 **템플릿 자신의** 프로젝트(자기 CI·자기 시험)이고, 인스턴스로 나가는
# 것은 `template/` 뿐이다. 그래서 `tests/test_copier_template.py` 가 더 이상 인스턴스로
# 새지 않는다 — 2026-08-28 실측으로 새고 있었다(자기 자신을 건너뛰긴 했지만 죽은 파일이었다).
#
# 🔴 **`bootstrap.sh` 가 하던 일은 전부 여기로 왔다** (`standards` R5-32). 그 스크립트는
# 파일을 만든 **뒤에** 고쳤다 — `git mv` 로 이름을 바꾸고 문자열을 치환했다. 그래서
# *"이미 bootstrap 된 것 같다"* 같은 상태 검사가 필요했고, 한 번 돌리면 되돌릴 수 없었고,
# 무엇보다 **틀린 이름을 받아 파일을 만든 뒤에야 멈출 수 있었다.**
# jinja 는 **만들기 전에** 정한다. 틀린 이름은 `validator` 가 **아무것도 만들기 전에** 막는다.

_min_copier_version: "9.0.0"

# 🔴 `CLAUDE.md` 는 `AGENTS.md` 를 가리키는 **심볼릭 링크**다. 기본값으로 두면 copier 가
# 링크를 따라가 **사본**을 만들고, 그러면 둘이 갈린다 — 링크로 둔 이유가 그것이다.
_preserve_symlinks: true

# 🔴 렌더 대상은 `template/` 뿐이다. 루트의 `copier.yml`·`src/`·`tests/`·자기 CI 는
# 애초에 후보가 아니므로 `_exclude` 에서 뺄 필요조차 없다 — 그게 이 배치의 요점이다.
_subdirectory: template

_exclude:
  - .venv
  - dist
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - __pycache__
  # ── 아키타입 조건부 ────────────────────────────────────────────
  # 바닥(`standards` direction/05)이 아키타입으로 조건을 건다. 여기가 그 집행부다.
  # 🔴 파일을 지우는 게 아니라 **애초에 안 만든다** — 스텁이 남지 않는다.
  - "{% if archetype not in ['backend', 'data-ml'] %}.env.example{% endif %}"
  - "{% if archetype not in ['backend', 'data-ml'] %}tests/test_env_example.py{% endif %}"

project_name:
  type: str
  help: 저장소 이름 (GitHub 규칙). 예 my-app
  # 🔴 저장소 이름과 Python 패키지 이름은 **규칙이 다르다.**
  # GitHub 은 `.` 을 허용하고 숫자로 시작해도 되지만 Python 은 아니다.
  # 옛 `bootstrap.sh` 의 첫 판은 대문자와 `-` 만 바꿨다 — `my.app` 이 `src/my.app` 이 되어
  # bootstrap 은 "완료" 라고 말하고 **pytest 가 나중에 실패**했다. 조용히 망가지는 것이 가장 나쁘다.
  # 바꿀 수 있으면 바꾸고, 못 바꾸면 **파일을 하나도 만들기 전에 여기서 멈춘다.**


  validator: >-
    {%- set pkg = project_name | regex_replace('[-. ]', '_') | lower -%}
    {%- if not project_name -%}
    이름이 비어 있다.
    {%- elif not (pkg | regex_search('^[a-z_][a-z0-9_]*$')) -%}
    저장소 이름 '{{ project_name }}' 에서 Python 패키지 이름을 못 만든다 — '{{ pkg }}' 는
    {% if pkg[:1] is match('[0-9]') %}숫자로 시작한다{% else %}식별자에 쓸 수 없는 문자가 있다{% endif %}.
    저장소 이름을 바꾸거나, 만든 뒤 src/ 와 pyproject.toml 의 name 을 손으로 정해라.
    {%- elif pkg in [
      'and','as','assert','async','await','break','class','continue','def','del','elif','else',
      'except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not',
      'or','pass','raise','return','try','while','with','yield'
    ] -%}
    저장소 이름 '{{ project_name }}' 에서 나온 패키지 이름 '{{ pkg }}' 는 **파이썬 예약어**다.
    import 할 수 없으므로 다른 이름을 골라라.
    {%- endif -%}

# 파생값이다 — 묻지 않는다. `when: false` 여도 기본값은 렌더 컨텍스트에 들어온다.
# 🔵 **한 곳에서만 도출한다.** 옛 판은 규칙이 `bootstrap.sh` 의 python 과 GNU/BSD `tr` 로
# 두 군데 있었고, `tr` 은 `'.- '` 를 BSD 에서는 받아주고 **GNU 에서는 범위로 읽어 거부**했다 —
# 로컬(macOS)은 통과하고 CI(ubuntu)만 깨졌다. 규칙과 검사가 같은 표현식이면 갈릴 수 없다.
package_name:
  type: str
  when: false
  default: "{{ project_name | regex_replace('[-. ]', '_') | lower }}"

license:
  type: str
  help: SPDX 라이선스
  default: MIT
  choices:
    MIT: MIT
    Apache-2.0: Apache-2.0

# 🔴 값은 **코퍼스가 정한다.** `standards` 의 28측면이 `gated_archetypes` 로 게이트를 걸고,
# 이 답이 그 게이트에 맞아야 바닥의 아키타입 층이 적용된다.
#
# 🔬 2026-08-29 정정 (`standards` R5-16 ②ⓑ): 전판은 **`service`** 를 물었는데 **코퍼스에 그 값이 없다**
# (코퍼스는 `web`/`backend` 를 쓴다). 그래서 *service* 라고 답하면 **게이트 걸린 측면 어디에도 안 걸렸다** —
# 층이 답 위에 서 있는데 답이 어휘 밖이었다. `standards` 의 `repo_audit` 이 이제 두 어휘를 대조한다.
#
# ⚠️ **조건 축은 여기서 안 묻는다.** `published`·`cloud`·`handles-user-data` 는 종류가 아니라
# 예/아니오이고 나중에 바뀐다. `handles-user-data` 는 `/kickoff` 가 따로 묻는다.
# 🔴 **이 생성기는 파이썬 패키지를 만든다** — `pyproject.toml`·`hatchling`·`uv.lock`·
# `src/<pkg>/`·`python-ci.yml`. 그래서 선택지는 **파이썬으로 지을 수 있는 것만** 있다.
#
# 2026-08-30 에 둘을 뺐다: **웹 프론트엔드**(JS/TS)와 **모바일 앱**(Swift/Kotlin/Dart).
# 고를 수는 있는데 나오는 것은 그냥 파이썬 패키지였다 — **질문이 기계가 지킬 수 없는 답을
# 제시하고 있었다.** 실물 증거: `mobile` 은 바닥의 어느 조건부 항목에도 안 걸렸는데,
# 그건 빠뜨려서가 아니라 **이 템플릿이 그걸 만들 수 없기 때문**이었다.
# `new-project.sh --private` 가 *받는 척하지 않고 멈추는* 것과 같은 규율이다.
archetype:
  type: str
  help: |
    이건 어떤 **종류**인가. 바닥의 조건부 항목이 이 답으로 정해진다
    (`.env.example`·설정 외부화는 돌아가는 서비스 맥락이다 — 12-Factor).
    모르겠으면 가장 좁은 것을 고른다.

    ⚠️ 이 생성기는 **파이썬 패키지**를 만든다. 웹 프론트엔드(JS/TS)나 모바일 앱은
    여기서 나오지 않는다 — 그건 다른 생성기가 할 일이다.
  default: cli
  choices:
    CLI: cli
    라이브러리: library
    백엔드/API 서비스: backend
    데이터·ML: data-ml
